name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Tool CLIs (vitest, eslint, electron-vite) still run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test

  e2e:
    # The user journeys, driven through the real Electron app against temp folders (T1.10.1).
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run --filter @amc/desktop build
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures
          path: apps/desktop/test-results/
          retention-days: 7

  package-smoke:
    # Proves the packaged app starts and SQLite (node:sqlite + FTS5) works (P0-03).
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Tool CLIs (vitest, eslint, electron-vite) still run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $env:AMC_SMOKE = '1'
          # With AMC_HOME set, the smoke run also boots the services and the utility process.
          $env:AMC_HOME = Join-Path $env:RUNNER_TEMP 'amc-smoke-home'
          $exe = Get-ChildItem apps/desktop/release -Recurse -Filter 'Agent Management Commander.exe' | Select-Object -First 1
          $out = & $exe.FullName 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($out -notmatch '"ok":true') { Write-Error 'services did not start cleanly'; exit 1 }

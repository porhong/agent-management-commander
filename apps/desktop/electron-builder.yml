appId: dev.amc.desktop
productName: Agent Management Commander
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
asarUnpack:
  - '**/*.node'
win:
  target: nsis
  # `build/icon.ico` is generated from the app's palette by `bun run --filter @amc/desktop icon`.
  icon: build/icon.ico
  artifactName: amc-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Uninstall must never touch the user's ~/.amc library.
  deleteAppDataOnUninstall: false
mac:
  target: dmg
linux:
  target: [AppImage, deb]
  icon: build/icon.png
  category: Development
npmRebuild: false

# Where `electron-updater` looks for a newer release (T1.10.4). Nothing is downloaded or
# installed without the user asking, and the check can be switched off in Settings.
publish:
  provider: github
  owner: porhong
  repo: agent-management-commander
